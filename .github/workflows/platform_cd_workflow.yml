  deploy-batch:
    name: Deploy_Batch
    runs-on: ubuntu-latest
    environment: ${{ inputs.exec_environment }}
    permissions:
      id-token: write
      contents: read
    needs: [execute-training-job]
    if: vars.IS_BATCH_DEPLOYMENT == 'True'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Copy common files
        shell: bash
        run: |
            if [ -d "src/${{ inputs.model_type }}/common/" ]; then
              echo "Copying common files for ${{ inputs.model_type }}"
              cp -r src/${{ inputs.model_type }}/common/* model/${{ inputs.model_type }}/batch
            else
              echo "No common directory found for ${{ inputs.model_type }}, skipping copy"
            fi

      - name: Provision azureml batch endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.provision_batch_endpoint \
                  --run_id ${{ github.run_id }} \
                  --environment_name ${{ inputs.exec_environment }} \
                  --model_type ${{ inputs.model_type }}

      - name: Wait for 180 seconds
        run: sleep 180

      - name: Provision azureml deployment
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.provision_batch_deployment \
                  --run_id ${{ github.run_id }} \
                  --environment_name ${{ inputs.exec_environment }} \
                  --model_type ${{ inputs.model_type }}

      - name: Test azureml batch endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.run_test_batch_deployment \
                  --environment_name ${{ inputs.exec_environment }} \
                  --model_type ${{ inputs.model_type }}

      - name: Re-authenticate after batch job completion
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

  change_model_tag:
    name: Apply Production Tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [execute-training-job]
    environment: ${{ inputs.exec_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Provision azureml online endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.approve_model \
                  --model_type ${{ inputs.model_type }}

  cleanup:
    name: Cleanup and Restore Security
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [execute-training-job, deploy-online, deploy-batch, change_model_tag]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Wait for concurrent deployments to finish
        if: inputs.enable_storage_public_access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for other in-progress deployments before restoring storage restrictions..."
          MAX_ITERATIONS=60
          ITERATION=0
          CURRENT_RUN=${{ github.run_id }}

          while [ $ITERATION -lt $MAX_ITERATIONS ]; do
            RUNNING_CD=$(gh run list \
              --workflow platform_cd_workflow.yml \
              --status in_progress \
              --json databaseId \
              --jq "[.[] | select(.databaseId != $CURRENT_RUN)] | length")

            RUNNING_DEPLOY_ONLY=$(gh run list \
              --workflow deploy_online_only.yml \
              --status in_progress \
              --json databaseId \
              --jq "length")

            TOTAL_RUNNING=$((RUNNING_CD + RUNNING_DEPLOY_ONLY))

            if [ "$TOTAL_RUNNING" -eq 0 ]; then
              echo "No concurrent deployments detected. Proceeding with storage restrict."
              break
            fi

            ITERATION=$((ITERATION + 1))
            echo "Iteration $ITERATION/$MAX_ITERATIONS: still waiting ($TOTAL_RUNNING active runs)..."
            sleep 30
          done

      - name: Restore Storage Network Restrictions
        if: inputs.enable_storage_public_access
        run: |
          echo "Restoring storage network restrictions after all deployments..."
          az storage account update \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --default-action Deny \
            --public-network-access Disabled

          echo "✅ Storage access restored to restricted mode."
          echo ""
          echo "Storage is now secured:"
          echo "  - Public network access: Disabled"
          echo "  - Default network action: Deny"
          echo "  - Shared key access: Disabled (policy-enforced)"

      - name: Skip restore (storage not opened by this run)
        if: ${{ !inputs.enable_storage_public_access }}
        run: |
          echo "Storage was not opened by this run; skipping restore."