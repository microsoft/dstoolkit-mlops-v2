name: Platform CD Workflow

on:
  workflow_dispatch:
    inputs:
      exec_environment:
        type: string
        default: "dev"
      model_type:
        type: string
        default: "london_taxi"
      enable_storage_public_access:
        type: boolean
        default: false
  workflow_call:
    inputs:
      exec_environment:
        type: string
        description: "Execution Environment"
        required: true
        default: "dev"
      model_type:
        type: string
        description: "type of model to execute"
        required: true
      enable_storage_public_access:
        type: boolean
        description: "Temporarily enable storage public network access for this run"
        required: false
        default: false

permissions:
  id-token: write
  contents: read

env:
  SUBSCRIPTION_ID: ${{vars.SUBSCRIPTION_ID}}
  RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
  WORKSPACE_NAME: ${{ vars.WORKSPACE_NAME }}
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCT_NAME }}
  ARM_CLIENT_ID: ${{vars.ARM_CLIENT_ID}}
  ARM_TENANT_ID: ${{vars.ARM_TENANT_ID}}
  BUILD_BUILDID: ${{ github.run_id }}
  BUILD_SOURCEBRANCHNAME: ${{ github.head_ref || github.ref_name }}

jobs:
  execute-training-job:
    name: Execute training job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Temporarily Enable Storage Public Access
        if: ${{ inputs.enable_storage_public_access }}
        run: |
          echo "Temporarily enabling storage public network access for training job execution..."
          echo "Note: This is acceptable for sample/learning environments. For production, use resource access rules."

          # Enable public network access for training jobs to access storage
          az storage account update \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --default-action Allow \
            --public-network-access Enabled

          echo "Waiting for storage configuration propagation..."
          sleep 15

      - name: Announce storage public access skipped
        if: ${{ !inputs.enable_storage_public_access }}
        run: |
          echo "Storage public network access was NOT enabled for this run (enable_storage_public_access=false)."
          echo "If deployments fail, check RBAC and private endpoint configuration for mfstac003 and mfacr001."

      - name: Execute MLOps Standard Pipeline
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.${{ inputs.model_type }}.src.mlops_pipeline \
                  --build_environment ${{ inputs.exec_environment }} \
                  --wait_for_completion True \
                  --output_file run_id.txt

      - name: Read Run ID
        shell: bash
        run: |
          readarray arr <"run_id.txt"
          run_name=${arr[0]}
          echo $run_name
          echo "RUN_NAME=${run_name}"  >> "$GITHUB_ENV"

      - name: Run Metadata
        shell: bash
        run: |
            python -m mlops.common.get_run_metadata \
              --run_id $RUN_NAME \
              --output_file_name metadata.txt

      - name: Read Metadata
        shell: bash
        run: |
          readarray arr <"metadata.txt"
          metadata=${arr[0]}
          echo $metadata
          echo "RUN_METADATA=${metadata}"  >> "$GITHUB_ENV"

  deploy-online:
    name: Deploy_Online
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [execute-training-job]
    if: vars.IS_ONLINE_DEPLOYMENT == 'True'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Copy common files
        shell: bash
        run: |
            if [ -d "src/${{ inputs.model_type }}/common/" ]; then
              echo "Copying common files for ${{ inputs.model_type }}"
              cp -r src/${{ inputs.model_type }}/common/* model/${{ inputs.model_type }}/online
            else
              echo "No common directory found for ${{ inputs.model_type }}, skipping copy"
            fi

      - name: Validate Storage Configuration (RBAC smoke tests)
        run: |
          echo "=== Validating Storage Configuration and AD-auth model download ==="

          # Print storage configuration for diagnostics
          az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --query '{name:name, defaultAction:networkRuleSet.defaultAction, allowSharedKeyAccess:allowSharedKeyAccess, publicNetworkAccess:publicNetworkAccess}' -o json

          echo "\nTesting blob access with workflow identity (auth-mode login)..."
          if ! az storage container list \
            --account-name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --auth-mode login \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --output table; then
            echo "❌ ERROR: Workflow identity cannot access storage - this indicates RBAC or network issues"
            exit 1
          fi

          echo "\nDeriving published model name for smoke download test..."
          PUBLISHED_MODEL_NAME=$(python - <<PY
from mlops.common.naming_utils import generate_model_name
print(generate_model_name("${{ inputs.model_type }}"))
PY
)
          echo "Published model name: $PUBLISHED_MODEL_NAME"

          echo "Listing registered models to find latest version..."
          MODEL_LIST_JSON=$(az ml model list \
            --name "$PUBLISHED_MODEL_NAME" \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} -o json)

          if [ -z "$MODEL_LIST_JSON" ] || [ "$MODEL_LIST_JSON" = "[]" ]; then
            echo "❌ ERROR: No registered model found named '$PUBLISHED_MODEL_NAME'"
            exit 1
          fi

          LATEST_VERSION=$(echo "$MODEL_LIST_JSON" | python - <<PY
import sys, json
info = json.load(sys.stdin)
if not info:
    sys.exit(2)
print(info[0].get('version'))
PY
)

          echo "Latest model version: $LATEST_VERSION"

          echo "Attempting model download using AD auth (auth-mode login)..."
          if ! az ml model download \
            --name "$PUBLISHED_MODEL_NAME" \
            --version "$LATEST_VERSION" \
            --download-path /tmp/model-download \
            --auth-mode login \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }}; then
            echo "❌ ERROR: Model download via AD auth failed - this indicates missing RBAC on the model storage or workspace"
            exit 1
          fi

          echo "✅ Storage RBAC smoke tests passed (workflow identity can list blobs and download model)."

          # Test actual blob access
          echo "Testing blob access with workflow identity..."
          if ! az storage container list \
            --account-name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --auth-mode login \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --output table; then
            echo "❌ ERROR: Workflow identity cannot access storage - this indicates RBAC or network issues"
            exit 1
          fi

          echo "✅ Storage configuration validated successfully"

      - name: Provision azureml online endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.provision_online_endpoint \
                  --model_type ${{ inputs.model_type }} \
                  --environment_name ${{ inputs.exec_environment }} \
                  --run_id ${{ github.run_id }}

      - name: Validate Endpoint Identity Storage Access
        run: |
          echo "=== Validating Endpoint Identity Permissions ==="

          # Get endpoint name from config (model_type uses underscore, endpoint names use hyphens)
          ENDPOINT_NAME=$(python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
              deployment_key = '${{ inputs.model_type }}_online_${{ inputs.exec_environment }}'
              endpoint_name = config['deployment_configs'][deployment_key]['endpoint_name']
              print(endpoint_name)
          ")

          echo "Endpoint Name: $ENDPOINT_NAME"

          ENDPOINT_IDENTITY=$(az ml online-endpoint show \
            --name $ENDPOINT_NAME \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --query 'identity.principal_id' -o tsv)

          if [ -z "$ENDPOINT_IDENTITY" ]; then
            echo "❌ ERROR: Could not retrieve endpoint managed identity"
            exit 1
          fi

          echo "Endpoint Identity: $ENDPOINT_IDENTITY"

          # Check for required storage roles
          STORAGE_SCOPE="/subscriptions/${{ env.SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP_NAME }}/providers/Microsoft.Storage/storageAccounts/${{ env.STORAGE_ACCOUNT_NAME }}"

          ROLE_ASSIGNMENTS=$(az role assignment list \
            --assignee $ENDPOINT_IDENTITY \
            --scope $STORAGE_SCOPE \
            --query '[].roleDefinitionName' -o tsv)

          echo "Current RBAC roles on storage:"
          echo "$ROLE_ASSIGNMENTS"

          # Validate endpoint has at least Storage Blob Data Reader
          if ! echo "$ROLE_ASSIGNMENTS" | grep -qE "(Storage Blob Data Reader|Storage Blob Data Contributor|Storage Blob Data Owner|Contributor|Owner)"; then
            echo "❌ ERROR: Endpoint identity lacks required storage role"
            echo "Required: At least 'Storage Blob Data Reader' role on storage account"
            echo "The endpoint needs this to download the model during deployment."
            exit 1
          fi

          echo "✅ Endpoint identity permissions validated successfully"

      - name: Provision azureml deployment
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.provision_online_deployment \
                  --model_type ${{ inputs.model_type }} \
                  --environment_name ${{ inputs.exec_environment }} \
                  --run_id ${{ github.run_id }}

      - name: Wait for endpoint startup and model download
        run: |
          echo "Waiting for endpoint to complete startup and model download..."
          echo "This ensures storage remains accessible during async endpoint provisioning."
          sleep 600

      - name: Test azureml real endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.run_test_model_on_aml \
                    --environment_name ${{ inputs.exec_environment }} \
                    --model_type ${{ inputs.model_type }}

  deploy-batch:
    name: Deploy_Batch
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [execute-training-job]
    if: vars.IS_BATCH_DEPLOYMENT == 'True'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Copy common files
        shell: bash
        run: |
            if [ -d "src/${{ inputs.model_type }}/common/" ]; then
              echo "Copying common files for ${{ inputs.model_type }}"
              cp -r src/${{ inputs.model_type }}/common/* model/${{ inputs.model_type }}/batch
            else
              echo "No common directory found for ${{ inputs.model_type }}, skipping copy"
            fi

      - name: Provision azureml batch endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.provision_batch_endpoint \
                  --run_id ${{ github.run_id }} \
                  --environment_name ${{ inputs.exec_environment }} \
                  --model_type ${{ inputs.model_type }}

      - name: Wait for 180 seconds
        run: sleep 180

      - name: Provision azureml deployment
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.provision_batch_deployment \
                  --run_id ${{ github.run_id }} \
                  --environment_name ${{ inputs.exec_environment }} \
                  --model_type ${{ inputs.model_type }}

      - name: Test azureml batch endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.run_test_batch_deployment \
                  --environment_name ${{ inputs.exec_environment }} \
                  --model_type ${{ inputs.model_type }}

      - name: Re-authenticate after batch job completion
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

  change_model_tag:
    name: Apply Production Tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [execute-training-job]
    environment:
        name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Provision azureml online endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.approve_model \
                  --model_type ${{ inputs.model_type }}

  cleanup:
    name: Cleanup and Restore Security
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [execute-training-job, deploy-online, deploy-batch, change_model_tag]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Restore Storage Network Restrictions
        run: |
          echo "Restoring storage network restrictions after all deployments..."
          az storage account update \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --default-action Deny \
            --public-network-access Disabled

          echo "✅ Storage access restored to restricted mode."
          echo ""
          echo "Storage is now secured:"
          echo "  - Public network access: Disabled"
          echo "  - Default network action: Deny"
          echo "  - Shared key access: Disabled (policy-enforced)"