name: Deploy Online Endpoint Only

on:
  workflow_dispatch:
    inputs:
      model_type:
        type: choice
        description: "Model type to deploy"
        required: true
        default: "london_taxi"
        options:
          - nyc_taxi
          - london_taxi
          - docker_taxi
          - sequence_model
      model_name:
        type: string
        description: "Optional: Specific model name (leave empty to auto-discover latest)"
        required: false
      model_version:
        type: string
        description: "Optional: Specific model version (leave empty to auto-discover latest)"
        required: false
      exec_environment:
        type: choice
        description: "Environment"
        required: true
        default: "dev"
        options:
          - dev
          - test
          - prod

permissions:
  id-token: write
  contents: read

env:
  SUBSCRIPTION_ID: ${{vars.SUBSCRIPTION_ID}}
  RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
  WORKSPACE_NAME: ${{ vars.WORKSPACE_NAME }}
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCT_NAME }}
  ARM_CLIENT_ID: ${{vars.ARM_CLIENT_ID}}
  ARM_TENANT_ID: ${{vars.ARM_TENANT_ID}}
  BUILD_BUILDID: ${{ github.run_id }}
  BUILD_SOURCEBRANCHNAME: ${{ github.head_ref || github.ref_name }}

jobs:
  deploy-online:
    name: Fast Deploy Online Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Copy common files
        shell: bash
        run: |
            if [ -d "src/${{ inputs.model_type }}/common/" ]; then
              echo "Copying common files for ${{ inputs.model_type }}"
              cp -r src/${{ inputs.model_type }}/common/* model/${{ inputs.model_type }}/online
            else
              echo "No common directory found for ${{ inputs.model_type }}, skipping copy"
            fi

      - name: Discover Model Name and Version
        id: discover_model
        run: |
          echo "=== Discovering Model Information ==="

          if [ -n "${{ inputs.model_name }}" ] && [ -n "${{ inputs.model_version }}" ]; then
            echo "Using provided model name and version"

            # Input validation: model_name should only contain alphanumeric, underscore, hyphen
            if ! [[ "${{ inputs.model_name }}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "ERROR: Invalid model_name. Only alphanumeric characters, underscore, and hyphen allowed."
              exit 1
            fi

            # Input validation: model_version should only contain digits
            if ! [[ "${{ inputs.model_version }}" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Invalid model_version. Only numeric values allowed."
              exit 1
            fi

            MODEL_NAME="${{ inputs.model_name }}"
            MODEL_VERSION="${{ inputs.model_version }}"
          else
            echo "Auto-discovering latest model for ${{ inputs.model_type }}"

            # Get unique model names with the prefix
            UNIQUE_NAMES=$(az ml model list \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --workspace-name ${{ env.WORKSPACE_NAME }} \
              --subscription ${{ env.SUBSCRIPTION_ID }} \
              --query "[?starts_with(name, '${{ inputs.model_type }}')].name" \
              -o tsv | sort -u)

            if [ -z "$UNIQUE_NAMES" ]; then
              echo "ERROR: No models found with prefix ${{ inputs.model_type }}"
              exit 1
            fi

            echo "Found models: $UNIQUE_NAMES"

            # Find the latest version across all matching models
            LATEST_CREATED=""
            BEST_NAME=""
            BEST_VERSION=""

            while IFS= read -r model_name; do
              echo "Checking latest version of: $model_name"

              # Get all versions for this model
              ALL_VERSIONS=$(az ml model list \
                --name "$model_name" \
                --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
                --workspace-name ${{ env.WORKSPACE_NAME }} \
                --subscription ${{ env.SUBSCRIPTION_ID }} \
                --query "[].{version:version, created:creation_context.created_at}" \
                -o json)

              # Sort by created date and get the latest
              LATEST_INFO=$(echo "$ALL_VERSIONS" | python3 -c "import sys, json; versions=json.load(sys.stdin); sorted_versions=sorted(versions, key=lambda x: x['created'], reverse=True); print(json.dumps(sorted_versions[0]) if sorted_versions else '{}')")

              THIS_VERSION=$(echo "$LATEST_INFO" | python3 -c "import sys, json; d=json.load(sys.stdin); print(str(d.get('version', '')) if d else '')")
              THIS_CREATED=$(echo "$LATEST_INFO" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('created', '') if d else '')")

              echo "  Latest version: $THIS_VERSION (created: $THIS_CREATED)"

              if [ -z "$LATEST_CREATED" ] || [[ "$THIS_CREATED" > "$LATEST_CREATED" ]]; then
                LATEST_CREATED="$THIS_CREATED"
                BEST_NAME="$model_name"
                BEST_VERSION="$THIS_VERSION"
              fi
            done <<< "$UNIQUE_NAMES"

            MODEL_NAME="$BEST_NAME"
            MODEL_VERSION="$BEST_VERSION"

            echo "Selected: $MODEL_NAME version $MODEL_VERSION"

            if [ -z "$MODEL_NAME" ] || [ -z "$MODEL_VERSION" ]; then
              echo "ERROR: Could not determine latest model"
              exit 1
            fi
          fi

          echo "Model Name: $MODEL_NAME"
          echo "Model Version: $MODEL_VERSION"

          echo "model_name=$MODEL_NAME" >> $GITHUB_OUTPUT
          echo "model_version=$MODEL_VERSION" >> $GITHUB_OUTPUT

          echo ""
          echo "=== Verifying Model Registration ==="

          if az ml model show \
            --name $MODEL_NAME \
            --version $MODEL_VERSION \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} > /dev/null 2>&1; then

            echo "✅ Model found in workspace"

            # Display model details
            az ml model show \
              --name $MODEL_NAME \
              --version $MODEL_VERSION \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --workspace-name ${{ env.WORKSPACE_NAME }} \
              --subscription ${{ env.SUBSCRIPTION_ID }} \
              --query '{name:name, version:version, type:type, path:path, createdTime:creation_context.created_at}' \
              -o table
          else
            echo "❌ ERROR: Model not found in workspace"
            echo "Model Name: $MODEL_NAME"
            echo "Model Version: $MODEL_VERSION"
            echo ""
            echo "Available models for ${{ inputs.model_type }}:"
            az ml model list \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --workspace-name ${{ env.WORKSPACE_NAME }} \
              --subscription ${{ env.SUBSCRIPTION_ID }} \
              --query "[?starts_with(name, '${{ inputs.model_type }}')].{name:name, version:version, created:creation_context.created_at}" \
              -o table || echo "No models found"
            exit 1
          fi

      - name: Validate Storage Configuration
        run: |
          echo "=== Validating Storage Configuration for Deployment ==="

          # Get storage configuration
          DEFAULT_ACTION=$(az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --query 'networkRuleSet.defaultAction' -o tsv)

          SHARED_KEY_ACCESS=$(az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --query 'allowSharedKeyAccess' -o tsv)

          echo "Storage Account: ${{ env.STORAGE_ACCOUNT_NAME }}"
          echo "Default Action: $DEFAULT_ACTION"
          echo "Shared Key Access: $SHARED_KEY_ACCESS"

          # Validate storage is accessible
          if [ "$DEFAULT_ACTION" != "Allow" ]; then
            echo "❌ ERROR: Storage default action is '$DEFAULT_ACTION' - must be 'Allow' for deployment"
            echo "The endpoint needs to download the model from storage during provisioning."
            exit 1
          fi

          # Test actual blob access
          echo "Testing blob access with workflow identity..."
          if ! az storage container list \
            --account-name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --auth-mode login \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --output table; then
            echo "❌ ERROR: Workflow identity cannot access storage - this indicates RBAC or network issues"
            exit 1
          fi

          echo "✅ Storage configuration validated successfully"

      - name: Provision or Update Online Endpoint
        run: |
          echo "=== Provisioning Online Endpoint ==="

          # Get endpoint name from config
          ENDPOINT_NAME=$(python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
              deployment_key = '${{ inputs.model_type }}_online_${{ inputs.exec_environment }}'
              endpoint_name = config['deployment_configs'][deployment_key]['endpoint_name']
              print(endpoint_name)
          ")

          echo "Endpoint Name: $ENDPOINT_NAME"

          # Check if endpoint exists
          if az ml online-endpoint show \
            --name $ENDPOINT_NAME \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} > /dev/null 2>&1; then
            echo "Endpoint $ENDPOINT_NAME already exists"
          else
            echo "Creating endpoint $ENDPOINT_NAME"
            az ml online-endpoint create \
              --name $ENDPOINT_NAME \
              --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
              --workspace-name ${{ env.WORKSPACE_NAME }} \
              --subscription ${{ env.SUBSCRIPTION_ID }}
          fi

      - name: Validate Endpoint Identity Storage Access
        run: |
          echo "=== Validating Endpoint Identity Permissions ==="

          # Get endpoint name from config
          ENDPOINT_NAME=$(python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
              deployment_key = '${{ inputs.model_type }}_online_${{ inputs.exec_environment }}'
              endpoint_name = config['deployment_configs'][deployment_key]['endpoint_name']
              print(endpoint_name)
          ")

          echo "Endpoint Name: $ENDPOINT_NAME"

          ENDPOINT_IDENTITY=$(az ml online-endpoint show \
            --name $ENDPOINT_NAME \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --query 'identity.principal_id' -o tsv)

          if [ -z "$ENDPOINT_IDENTITY" ]; then
            echo "❌ ERROR: Could not retrieve endpoint managed identity"
            exit 1
          fi

          echo "Endpoint Identity: $ENDPOINT_IDENTITY"

          # Check for required storage roles
          STORAGE_SCOPE="/subscriptions/${{ env.SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP_NAME }}/providers/Microsoft.Storage/storageAccounts/${{ env.STORAGE_ACCOUNT_NAME }}"

          ROLE_ASSIGNMENTS=$(az role assignment list \
            --assignee $ENDPOINT_IDENTITY \
            --scope $STORAGE_SCOPE \
            --query '[].roleDefinitionName' -o tsv)

          echo "Current RBAC roles on storage:"
          echo "$ROLE_ASSIGNMENTS"

          # Validate endpoint has at least Storage Blob Data Reader
          if ! echo "$ROLE_ASSIGNMENTS" | grep -qE "(Storage Blob Data Reader|Storage Blob Data Contributor|Storage Blob Data Owner|Contributor|Owner)"; then
            echo "❌ ERROR: Endpoint identity lacks required storage role"
            echo "Required: At least 'Storage Blob Data Reader' role on storage account"
            echo "The endpoint needs this to download the model during deployment."
            exit 1
          fi

          echo "✅ Endpoint identity permissions validated successfully"

      - name: Deploy Model to Endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.provision_online_deployment \
                  --model_type ${{ inputs.model_type }} \
                  --environment_name ${{ inputs.exec_environment }} \
                  --run_id ${{ github.run_id }}

      - name: Test Online Endpoint
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
                python -m mlops.common.deployment.run_test_model_on_aml \
                    --environment_name ${{ inputs.exec_environment }} \
                    --model_type ${{ inputs.model_type }}

      - name: Deployment Summary
        if: always()
        run: |
          echo "=== Deployment Summary ==="
          echo "Model: ${{ steps.discover_model.outputs.model_name }} v${{ steps.discover_model.outputs.model_version }}"
          echo "Model Type: ${{ inputs.model_type }}"
          echo "Environment: ${{ inputs.exec_environment }}"

          # Get endpoint name from config
          ENDPOINT_NAME=$(python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
              deployment_key = '${{ inputs.model_type }}_online_${{ inputs.exec_environment }}'
              endpoint_name = config['deployment_configs'][deployment_key]['endpoint_name']
              print(endpoint_name)
          ")

          echo "Endpoint: $ENDPOINT_NAME"

          # Get deployment status
          az ml online-endpoint show \
            --name $ENDPOINT_NAME \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --query '{name:name, state:provisioning_state, traffic:traffic}' \
            -o table

          echo ""
          echo "View deployment logs:"
          echo "az ml online-deployment get-logs --name \$(az ml online-endpoint show --name $ENDPOINT_NAME -g ${{ env.RESOURCE_GROUP_NAME }} -w ${{ env.WORKSPACE_NAME }} --subscription ${{ env.SUBSCRIPTION_ID }} --query 'traffic' -o tsv | head -1 | cut -d':' -f1) --endpoint-name $ENDPOINT_NAME -g ${{ env.RESOURCE_GROUP_NAME }} -w ${{ env.WORKSPACE_NAME }} --subscription ${{ env.SUBSCRIPTION_ID }}"
