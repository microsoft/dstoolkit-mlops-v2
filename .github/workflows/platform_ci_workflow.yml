name: Platform CI Workflow

on:
  workflow_dispatch:
    inputs:
      exec_environment:
        type: string
        default: "pr"
      model_type:
        type: string
        default: "london_taxi"
      is_docker:
        type: boolean
        default: false
      enable_storage_public_access:
        type: boolean
        default: true
  workflow_call:
    inputs:
      exec_environment:
        type: string
        description: "Execution Environment"
        required: true
        default: "pr"
      model_type:
        type: string
        description: "type of model to execute"
        required: true
      is_docker:
          type: boolean
          description: "Is Docker used for build validation?"
          required: true
          default: false
      enable_storage_public_access:
        type: boolean
        description: "Temporarily enable storage public network access for this run"
        required: false
        default: true
      # arm_client_id:
      #   required: true
      #   type: string
      # arm_tenant_id:
      #   required: true
      #   type: string
      # subscription_id:
      #   required: true
      #   type: string

permissions:
  id-token: write
  contents: read

env:
  SUBSCRIPTION_ID: ${{vars.SUBSCRIPTION_ID}}
  RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
  WORKSPACE_NAME: ${{ vars.WORKSPACE_NAME }}
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCT_NAME }}
  ARM_CLIENT_ID: ${{vars.ARM_CLIENT_ID}}
  ARM_TENANT_ID: ${{vars.ARM_TENANT_ID}}
  BUILD_BUILDID: ${{ github.run_id }}
  BUILD_SOURCEBRANCHNAME: ${{ github.head_ref || github.ref_name }}

jobs:
  enable-storage-access:
    name: Enable Storage Public Access
    if: ${{ inputs.enable_storage_public_access }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Temporarily Enable Storage Public Access
        run: |
          echo "Temporarily enabling storage public network access for training job execution..."
          echo "Note: This is acceptable for sample/learning environments. For production, use resource access rules."

          # Enable public network access for training jobs to access storage
          az storage account update \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --default-action Allow \
            --public-network-access Enabled

          echo "Waiting for storage configuration propagation..."
          sleep 15

  build-validation:
    name: Build Validation
    needs: storage-access-join
    uses: ./.github/workflows/build_validation_workflow.yml
    with:
      image_name: ${{ inputs.exec_environment }}
      model_type: ${{ inputs.model_type }}
      is_docker: ${{ inputs.is_docker }}

  announce-storage-skip:
    name: Announce storage public access skipped
    if: ${{ !inputs.enable_storage_public_access }}
    runs-on: ubuntu-latest
    steps:
      - name: Log storage public access skipped
        run: |
          echo "Storage public network access was NOT enabled for this run (enable_storage_public_access=false)."
          echo "If deployments fail, check RBAC and private endpoint configuration for mfstac003 and mfacr001."
          echo "To run with temporary public access enabled, set input 'enable_storage_public_access=true' when triggering the workflow."

  storage-access-join:
    name: Storage Access Join
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Report storage access mode
        run: |
          echo "enable_storage_public_access=${{ inputs.enable_storage_public_access }}"
          echo "This job joins whichever of enable-storage-access or announce-storage-skip ran."

  execute-ml-job-pipeline:
    name: Execute ML Job Pipeline
    runs-on: ubuntu-latest
    needs: build-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}
        # with:
        #   arm_client_id: ${{ vars.ARM_CLIENT_ID }}
        #   arm_tenant_id: ${{ vars.ARM_TENANT_ID }}
        #   subscription_id: ${{ vars.SUBSCRIPTION_ID }}

      - name: Execute AzureML Pipeline
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
              python -m mlops.${{ inputs.model_type }}.src.mlops_pipeline \
                  --build_environment ${{ inputs.exec_environment }} \
                  --wait_for_completion True
