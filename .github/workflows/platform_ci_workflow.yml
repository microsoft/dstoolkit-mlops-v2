name: Platform CI Workflow

on:
  workflow_dispatch:
    inputs:
      exec_environment:
        type: string
        default: "pr"
      model_type:
        type: string
        default: "nyc_taxi"
      is_docker:
        type: boolean
        default: false
  workflow_call:
    inputs:
      exec_environment:
        type: string
        description: "Execution Environment"
        required: true
        default: "pr"
      model_type:
        type: string
        description: "type of model to execute"
        required: true
      is_docker:
          type: boolean
          description: "Is Docker used for build validation?"
          required: true
          default: false

permissions:
  id-token: write
  contents: read

env:
  SUBSCRIPTION_ID: ${{vars.SUBSCRIPTION_ID}}
  RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
  WORKSPACE_NAME: ${{ vars.WORKSPACE_NAME }}
  ARM_CLIENT_ID: ${{vars.ARM_CLIENT_ID}}
  ARM_TENANT_ID: ${{vars.ARM_TENANT_ID}}
  BUILD_BUILDID: ${{ github.run_id }}
  BUILD_SOURCEBRANCHNAME: ${{ github.head_ref || github.ref_name }}

jobs:
  build-validation:
    name: Build Validation
    uses: ./.github/workflows/build_validation_workflow.yml
    with:
      image_name: ${{ inputs.exec_environment }}
      model_type: ${{ inputs.model_type }}
      is_docker: ${{ inputs.is_docker }}

  execute-ml-job-pipeline:
    name: Execute ML Job Pipeline
    runs-on: ubuntu-latest
    needs: build-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Azure ML Agent
        uses: "./.github/actions/configure_azureml_agent"
        with:
          arm_client_id: ${{ env.ARM_CLIENT_ID }}
          arm_tenant_id: ${{ env.ARM_TENANT_ID }}
          subscription_id: ${{ env.SUBSCRIPTION_ID }}

      - name: Add GitHub Runner IP to Storage Firewall
        run: |
          echo "Getting runner public IP..."
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"

          echo "Adding IP to storage account firewall..."
          az storage account network-rule add \
            --account-name mfstac003 \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --ip-address $RUNNER_IP

          echo "Waiting for firewall rule to propagate..."
          sleep 10

      - name: Diagnostic - Test Storage Access for AzureML Workspace identity
        run: |
          echo "=== Testing Storage Account Access ==="

          # Get storage account key for testing
          STORAGE_ACCOUNT="mfstac003"
          RESOURCE_GROUP="${{ env.RESOURCE_GROUP_NAME }}"

          echo "Testing network connectivity to storage account..."
          az storage account show --name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP --query "name" -o tsv

          echo "Checking public network access setting..."
          az storage account show --name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP --query "publicNetworkAccess" -o tsv

          echo "Checking network rule set..."
          az storage account show --name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP --query "networkRuleSet"

          echo "Testing blob write access with current identity..."
          CONTAINER_NAME="azureml-test-$(date +%s)"
          az storage container create --account-name $STORAGE_ACCOUNT --name $CONTAINER_NAME --auth-mode login || echo "FAILED: Cannot create container"

          if az storage container exists --account-name $STORAGE_ACCOUNT --name $CONTAINER_NAME --auth-mode login -o tsv | grep -q "True"; then
            echo "SUCCESS: Storage access is working"
            az storage container delete --account-name $STORAGE_ACCOUNT --name $CONTAINER_NAME --auth-mode login
          else
            echo "FAILED: Storage access is blocked"
            exit 1
          fi

      - name: Execute AzureML Pipeline
        uses: ./.github/actions/execute_shell_code
        with:
            arm_client_id: ${{ env.ARM_CLIENT_ID }}
            arm_tenant_id: ${{ env.ARM_TENANT_ID }}
            subscription_id: ${{ env.SUBSCRIPTION_ID }}
            script_parameter: |
              python -m mlops.${{ inputs.model_type }}.src.mlops_pipeline \
                  --build_environment ${{ inputs.exec_environment }} \
                  --wait_for_completion True

      - name: Remove GitHub Runner IP from Storage Firewall
        if: always()
        run: |
          echo "Removing runner IP from storage account firewall..."
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az storage account network-rule remove \
            --account-name mfstac003 \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --ip-address $RUNNER_IP || echo "IP already removed or not found"
