name: Install Workflow Requirements

description: Installs the required python packages for the workflow.

inputs:
  versionSpec:
    description: "The Python version to use in the environment."
    default: "3.10"
  arm_client_id:
    description: "client id of service principal used to authenticate with azure"
    required: true
  arm_tenant_id:
    description: "client id of service principal used to authenticate with azure"
    required: true
  subscription_id:
    description: "client id of service principal used to authenticate with azure"
    required: true

runs:
  using: composite
  steps:
    - name: Debug - Check Input Values
      shell: bash
      run: |
        echo "=== Debugging Input Values ==="
        echo "arm_client_id length: ${#CLIENT_ID}"
        echo "arm_tenant_id length: ${#TENANT_ID}"
        echo "subscription_id length: ${#SUB_ID}"
        if [ -z "$CLIENT_ID" ]; then
          echo "ERROR: arm_client_id is empty!"
        else
          echo "arm_client_id first 4 chars: ${CLIENT_ID:0:4}..."
        fi
        if [ -z "$TENANT_ID" ]; then
          echo "ERROR: arm_tenant_id is empty!"
        else
          echo "arm_tenant_id first 4 chars: ${TENANT_ID:0:4}..."
        fi
        if [ -z "$SUB_ID" ]; then
          echo "ERROR: subscription_id is empty!"
        else
          echo "subscription_id first 4 chars: ${SUB_ID:0:4}..."
        fi
      env:
        CLIENT_ID: ${{ inputs.arm_client_id }}
        TENANT_ID: ${{ inputs.arm_tenant_id }}
        SUB_ID: ${{ inputs.subscription_id }}

    - name: Clear Azure CLI Cache
      shell: bash
      run: |
        echo "Clearing Azure CLI cache to prevent authentication issues..."
        rm -rf ~/.azure/msal_http_cache.bin || true
        rm -rf ~/.azure/msal_token_cache.bin || true
        rm -rf ~/.azure/service_principal_entries.bin || true
        echo "Azure CLI cache cleared."

    - name: Azure login
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        client-id: ${{ inputs.arm_client_id }}
        tenant-id: ${{ inputs.arm_tenant_id }}
        subscription-id: ${{ inputs.subscription_id }}

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.versionSpec }}

    - name: Load Python Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade -r .github/requirements/execute_job_requirements.txt