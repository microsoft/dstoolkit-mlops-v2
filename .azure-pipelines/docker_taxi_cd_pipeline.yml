# [DEPRECATED] Azure Pipelines is retired; GitHub Actions is the primary CI/CD. File kept for reference and will be removed after 2026-01-31.
pr: none
trigger: none

pool:
  vmImage: ubuntu-latest


variables:
- group: mlops_platform_dev_vg

parameters:
 - name: env_name
   displayName: "Execution Environment"
   default: "dev"
 - name: model_type
   displayName: "model type"
   default: "docker_taxi"

stages:
  - template: templates/platform_cd_pipeline.yml
    parameters:
      exec_environment: ${{ parameters.env_name }}
      model_type: ${{ parameters.model_type }}
